<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>GroWise — AI-Powered Growth Platform for Businesses</title>
    <meta
      name="description"
      content="GroWise is an AI-powered growth platform that handles your social media, content, leads, and ads — so you can focus on running your business. Free AI Growth Audit included. Plans from \u20B94,999/month."
    />
    <meta
      name="keywords"
      content="AI growth platform, AI social media management, Instagram marketing, WhatsApp leads, AI content creation, video advertising, social media agency, growth marketing, AI marketing platform, small business marketing"
    />
    <meta name="author" content="GroWise" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://growise.com/" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="application-name" content="GroWise" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GroWise" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GroWise" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="GroWise — AI-Powered Growth Platform for Businesses" />
    <meta
      property="og:description"
      content="You run the business. We run your growth. AI-powered content, leads, ads, and analytics — all in one platform. Free growth audit included."
    />
    <meta property="og:url" content="https://growise.com/" />
    <meta property="og:image" content="/og-cover.svg" />
    <meta property="og:image:alt" content="GroWise — AI-Powered Growth Platform" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@growise" />
    <meta name="twitter:creator" content="@growise" />
    <meta name="twitter:title" content="GroWise — AI-Powered Growth Platform for Businesses" />
    <meta
      name="twitter:description"
      content="You run the business. We run your growth. AI-powered content, leads, ads, and analytics — all in one platform."
    />
    <meta name="twitter:image" content="/og-cover.svg" />
    <meta name="twitter:image:alt" content="GroWise — AI-Powered Growth Platform" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GroWise",
        "url": "https://growise.com",
        "logo": "https://growise.com/logo.png",
        "description": "AI-powered growth platform for businesses — content, leads, ads, and analytics in one system.",
        "slogan": "You run the business. We run your growth.",
        "areaServed": "IN",
        "sameAs": []
      }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "GroWise",
        "url": "https://growise.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://growise.com/audit?handle={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Structured Data: Service -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "name": "GroWise AI Growth Platform",
        "provider": {
          "@type": "Organization",
          "name": "GroWise"
        },
        "description": "AI-powered growth platform handling social media content, WhatsApp lead generation, ad management, and analytics for businesses.",
        "areaServed": "IN",
        "serviceType": [
          "AI Content Creation",
          "Social Media Management",
          "WhatsApp Lead Generation",
          "Ad Management",
          "Growth Analytics"
        ],
        "offers": [
          {
            "@type": "Offer",
            "name": "Essential",
            "price": "4999",
            "priceCurrency": "INR",
            "billingIncrement": "P1M"
          },
          {
            "@type": "Offer",
            "name": "Growth",
            "price": "9999",
            "priceCurrency": "INR",
            "billingIncrement": "P1M"
          }
        ]
      }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What exactly does GroWise do?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "GroWise is an AI-powered growth platform that handles your entire marketing engine — from strategy and content creation to publishing, lead generation, and ad management."
            }
          },
          {
            "@type": "Question",
            "name": "Is the AI Growth Audit really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. GroWise analyzes your digital presence across Instagram, YouTube, and the web to generate your Overall Growth Score and a custom strategy blueprint — completely free, with no credit card required."
            }
          },
          {
            "@type": "Question",
            "name": "How many videos will I get per month?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Essential plan includes 8 Reels per month (2 per week). The Growth plan includes 20 Reels per month (5 per week), plus carousels, stories, and hooks."
            }
          },
          {
            "@type": "Question",
            "name": "How does the WhatsApp lead engine work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "GroWise captures leads from your social content and routes them to WhatsApp with automated follow-up sequences. AI qualifies each lead so you only spend time on the ones that matter."
            }
          }
        ]
      }
    </script>

    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
