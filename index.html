<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>GroWise — You Run the Business. We Run Your Social Media.</title>
    <meta
      name="description"
      content="GroWise is an AI-powered advertising & social media management agency. Done-for-you video ads, reels, shorts and content — so you can run your business while we keep your brand impossible to ignore."
    />
    <meta
      name="keywords"
      content="AI advertising agency, AI video advertising, social media management, AI social media content, Instagram advertising, video advertising agency, social media agency, AI marketing agency, advertising agency for small business"
    />
    <meta name="author" content="GroWise" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://growise.example.com/" />
    <meta name="theme-color" content="#0b0b0c" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GroWise" />
    <meta property="og:title" content="GroWise — You Run the Business. We Run Your Social Media." />
    <meta
      property="og:description"
      content="Done-for-you video advertisements, reels, shorts and social media content — powered by AI, directed by humans. Starting ₹4,999/month."
    />
    <meta property="og:url" content="https://growise.example.com/" />
    <meta property="og:image" content="/og-cover.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GroWise — You Run the Business. We Run Your Social Media." />
    <meta
      name="twitter:description"
      content="Done-for-you video ads, reels, shorts and social media content — powered by AI, directed by humans."
    />
    <meta name="twitter:image" content="/og-cover.svg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "GroWise",
        "description": "AI-powered advertising and social media management agency. Done-for-you video advertisements and content for businesses.",
        "slogan": "You run the business. We run your social media.",
        "priceRange": "₹₹",
        "areaServed": "India",
        "serviceType": [
          "AI-powered video advertising",
          "Social media management",
          "Instagram Reels",
          "YouTube Shorts",
          "Product advertisements",
          "Creative strategy"
        ]
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
